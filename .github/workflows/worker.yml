name: Deploy GOING NBA main-line Worker

on:
  push:
    branches: [main, codex/nba-overnight-props]
    paths:
      - 'worker/**'
      - 'site/nba-main-lines.mjs'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: going-nba-lines-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Deploy NBA main-line Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: worker
      - name: Check the public main-line feed
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error --max-time 12 --retry 5 --retry-all-errors --retry-delay 10 \
            "$WORKER_URL/nba-main-lines/Points" | jq -e '(.markets | type) == "array" and (.selections | type) == "array"'

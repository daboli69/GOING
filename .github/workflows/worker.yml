name: Deploy going-live Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'site/feeds.mjs'
      - 'scripts/lineups.mjs'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: going-live-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check model feed secret
        env:
          MODEL_FEEDS_TOKEN: ${{ secrets.MODEL_FEEDS_TOKEN }}
        run: test -n "$MODEL_FEEDS_TOKEN" || { echo "::error::Add the MODEL_FEEDS_TOKEN repository secret."; exit 1; }
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: worker
      - name: Set the Worker model feed secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODEL_FEEDS_TOKEN: ${{ secrets.MODEL_FEEDS_TOKEN }}
        run: printf '%s' "$MODEL_FEEDS_TOKEN" | npx --yes wrangler@4.161.0 secret put GITHUB_TOKEN
      - name: Show Worker URL
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "$WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

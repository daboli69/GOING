name: Deploy GOING NBA main-line Worker

on:
  push:
    branches: [main, codex/nba-overnight-props]
    paths:
      - 'worker/**'
      - 'site/nba-main-lines.mjs'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: going-nba-lines-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Deploy NBA main-line Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: worker

name: Deploy GOING NBA main-line Worker

on:
  push:
    branches: [main, codex/nba-overnight-props]
    paths:
      - 'worker/**'
      - 'site/nba-main-lines.mjs'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: going-nba-lines-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Register workers.dev for GOING
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          status=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/worker-subdomain.json" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$endpoint")
          if [ "$status" = 200 ] && jq -e '.result.subdomain | strings | length > 0' "$RUNNER_TEMP/worker-subdomain.json" >/dev/null; then exit 0; fi
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then jq -c '.errors' "$RUNNER_TEMP/worker-subdomain.json"; exit 1; fi
          curl -sS --max-time 15 -X PUT -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' --data '{"subdomain":"goingplaybook"}' "$endpoint" | jq -e 'if .success then .result.subdomain else error(.errors|tostring) end'
      - name: Deploy NBA main-line Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: worker

name: Publish NBA main lines

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [codex/nba-overnight-props]
    paths:
      - '.github/workflows/nba-main-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-live-lines
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Disable the unused Cloudflare preview endpoint
        if: github.ref_name == 'codex/nba-overnight-props'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error --max-time 15 -X POST \
            -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":false,"previews_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/going-nba-lines/subdomain" | jq -e '.success'
      - name: Publish verified DraftKings lines for today and tomorrow Eastern
        run: |
          dir=$(mktemp -d)
          if git fetch --no-tags --depth 1 origin refs/heads/nba-live-lines; then
            git worktree add --detach "$dir" FETCH_HEAD
          else
            git worktree add --detach "$dir" HEAD
            git -C "$dir" switch --orphan nba-live-lines
          fi
          node scripts/publish-nba-main-lines.mjs "$dir"
          git -C "$dir" add -A
          if git -C "$dir" diff --cached --quiet; then exit 0; fi
          git -C "$dir" -c user.name="GOING price feed" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "DraftKings NBA main lines $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C "$dir" push origin HEAD:refs/heads/nba-live-lines

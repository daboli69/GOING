name: Check published GOING

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh and deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: going-delivery-check
  cancel-in-progress: false

jobs:
  delivery:
    if: github.repository == 'daboli69/GOING'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/watch-delivery.mjs
        env:
          GH_TOKEN: ${{ github.token }}

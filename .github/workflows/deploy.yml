name: Refresh and deploy

# Hourly, all day: slates, injuries, public prices and NHL lineups (about a minute).
# 7am Eastern every morning (the first run after 7:00, DST-proof) and 17:07 UTC: also rebuild the season
# archives (nflverse, hoopR, NHL), so the day starts on fresh data for every sport.
# The local model publisher starts a run with mode=models whenever forecasts change.
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = snapshots only, full = also rebuild season archives, models = new model feeds'
        type: choice
        options: [live, full, models]
        default: live

permissions:
  contents: write   # the pick tracker commits its record to the `tracker` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore season archives
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            site/data/*.json
          key: archive-v1-${{ github.run_id }}
          restore-keys: archive-v1-

      - name: Choose mode
        id: mode
        run: |
          mode="${{ inputs.mode || 'live' }}"
          hour=$(date -u +%H)
          east=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$east" = "07" ] || [ "$hour" = "17" ]; }; then mode=full; fi
          deep=""
          if [ -z "${{ steps.archive.outputs.cache-matched-key }}" ]; then mode=full; deep="--deep"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode $deep"

      - name: Rebuild season archives
        if: steps.mode.outputs.mode == 'full'
        run: node scripts/refresh.mjs ${{ steps.mode.outputs.deep }} || echo "::warning::Archive refresh had errors; deploying the data that did load."

      - name: Save season archives
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            site/data/*.json
          key: archive-v1-${{ github.run_id }}

      - name: Capture live snapshots
        run: node scripts/live.mjs || echo "::warning::Live snapshot failed; pages fall back to the archives."

      - name: Restore college feeds
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/college
            site/data/college
          key: college-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: college-v1-

      - name: Refresh college feeds
        run: node scripts/college.mjs || echo "::warning::Some college feeds did not refresh; keeping the last available snapshots."

      - name: Save college feeds
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/college
            site/data/college
          key: college-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # GOING YARD: hr-board runs its own model on its own schedule; this copies what it last published.
      - name: Add GOING YARD board
        run: node scripts/yard.mjs || echo "::warning::GOING YARD data could not be refreshed."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add model feeds
        run: |
          mkdir -p site/data/models
          if git fetch --depth 1 origin model-feeds 2>/dev/null; then
            for f in nfl nba summary; do git show FETCH_HEAD:models/$f.json > site/data/models/$f.json 2>/dev/null || rm -f site/data/models/$f.json; done
          else
            echo "::notice::No model-feeds branch yet. Run publishers/publish_models.bat --push on the lab PC."
          fi

      # Pick tracker: the permanent record lives on the `tracker` branch, never in the cache.
      - name: Restore pick record
        run: |
          mkdir -p site/data/tracker
          if git fetch --depth 1 origin tracker:refs/remotes/origin/tracker 2>/dev/null; then git archive refs/remotes/origin/tracker | tar -x -C site/data/tracker; fi

      - name: Capture and grade picks
        id: track
        run: node scripts/track.mjs || echo "::warning::Pick tracker failed; the previous record is still published."

      - name: Capture and grade NBA parlay legs
        run: node scripts/track-nba-parlays.mjs || echo "::warning::NBA parlay tracker failed; the previous record is still published."

      - name: Save pick record
        run: |
          set -e
          dir=$(mktemp -d)
          if git rev-parse --verify -q refs/remotes/origin/tracker >/dev/null; then
            git worktree add --detach "$dir" refs/remotes/origin/tracker
          else
            git worktree add --detach "$dir" && (cd "$dir" && git checkout --orphan tracker && git rm -rfq .)
          fi
          cp site/data/tracker/*.json "$dir"/ 2>/dev/null || exit 0
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then echo "Pick record unchanged."; exit 0; fi
          git -c user.name="GOING tracker" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Pick record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:refs/heads/tracker

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: node scripts/build.mjs
        env:
          GOING_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

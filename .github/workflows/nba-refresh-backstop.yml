name: Deploy NBA refresh backstop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-refresh-backstop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require the repository-scoped dispatch secret
        env:
          GITHUB_NBA_REFRESH_TOKEN: ${{ secrets.GITHUB_NBA_REFRESH_TOKEN }}
        run: test -n "$GITHUB_NBA_REFRESH_TOKEN"
      - name: Deploy the scheduled Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: worker/nba-refresh-backstop
          secrets: GITHUB_NBA_REFRESH_TOKEN
        env:
          GITHUB_NBA_REFRESH_TOKEN: ${{ secrets.GITHUB_NBA_REFRESH_TOKEN }}
